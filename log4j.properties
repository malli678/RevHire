# Suppress Log4J initialization messages
log4j.debug=false
log4j.defaultInitOverride=true

# Root logger - ONLY FILE, NO CONSOLE
log4j.rootLogger=INFO, file

# File appender
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=logs/revhire.log
log4j.appender.file.MaxFileSize=10MB
log4j.appender.file.MaxBackupIndex=5
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Console appender - only for errors/warnings
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Threshold=WARN
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p - %m%n


# Specific log levels for packages
log4j.logger.com.revhire=DEBUG
log4j.logger.com.revhire.dao=INFO
log4j.logger.com.revhire.service=DEBUG
log4j.logger.com.revhire.ui=INFO